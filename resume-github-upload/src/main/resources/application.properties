server.port=8081
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SMTP Configuration
app.smtp.host=smtp.gmail.com
app.smtp.port=587
app.smtp.username=diyaadathan@gmail.com
app.smtp.password=${SMTP_PASSWORD}
app.smtp.auth=true
app.smtp.starttls=true

# Secrets such as SMTP_PASSWORD come from .env (git-ignored) or the real environment
spring.config.import=optional:file:.env[.properties]
